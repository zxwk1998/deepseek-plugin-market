name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 定时任务交给 deploy-server.yml：真正对外的是自建服务器，
  # 两边都挂 cron 会每天重复采集两次，白白消耗 GitHub API 配额与 Actions 分钟数。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 推送代码时用仓库里的数据快照；定时 / 手动触发时先从 GitHub 源头采集。
      # 采集脚本自带校验：限流导致条目骤降、查询失效都会直接失败，
      # 后续步骤不执行 —— 站点保留上一版，不会发布空目录。
      - name: Collect data from GitHub
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm sync

      - name: Lint & typecheck
        run: |
          pnpm lint
          pnpm typecheck

      - name: Build (static export)
        env:
          # GitHub Pages 项目站点部署在 /<repo> 子路径下
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
